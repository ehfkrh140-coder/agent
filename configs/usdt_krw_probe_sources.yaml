      - Candidate retained only as historical metadata; out_of_scope_for_tether_cross_market.
      - Manual review of no-key availability and timestamp metadata is only for a future FX-basis task.
    reliability_notes:
      - Do not probe until no-key public status is confirmed; do not add credentials.
    notes:
      - Disabled candidate; no safe no-key endpoint is selected in this config.
      - Keep skipped/unknown until source policy is reviewed.

