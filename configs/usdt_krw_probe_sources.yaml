    notes:
      - Disabled for current tether_cross_market_premium probe alignment; FX is out_of_scope_for_tether_cross_market.
      - Candidate only; no safe no-key endpoint has been selected in this config.
      - Probe records skipped/unknown rather than scraping or using credentials.

